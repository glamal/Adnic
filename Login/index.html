<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Secure sign in to your health insurance member portal." />
  <title>Sign In | CareSure Insurance</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
    rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #e7e7e7;
      color: #171b22;
      font-family: "Google Sans", sans-serif;
    }

    .login-shell {
      width: min(1180px, 100%);
      min-height: 700px;
      display: grid;
      grid-template-columns: 0.88fr 1.12fr;
      gap: 16px;
      padding: 12px;
      border-radius: 30px;
      background: #fff;
      box-shadow: 0 18px 60px rgba(29, 39, 54, .07);
      overflow: hidden;
    }

    .login-side {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 42px 48px;
      background: #fff;
    }

    .login-content {
      width: 100%;
      max-width: 350px;
    }

    .brand {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 9px;
      margin-bottom: 27px;
      color: #18355e;
      font-size: 18px;
      font-weight: 750;
      letter-spacing: -.5px;
    }

    .brand-mark {
      position: relative;
      width: 27px;
      height: 27px;
      display: grid;
      place-items: center;
      border-radius: 9px 9px 9px 3px;
      background: #18355e;
      color: white;
      font-size: 17px;
      font-weight: 800;
      transform: rotate(-4deg);
    }

    .brand-mark::after {
      content: "+";
      position: absolute;
      right: -5px;
      top: -7px;
      color: #3c9bdf;
      font-size: 17px;
      font-weight: 800;
    }

    .login-title {
      margin: 0;
      text-align: center;
      font-size: clamp(25px, 2.5vw, 31px);
      line-height: 1.2;
      letter-spacing: -1.1px;
      font-weight: 400;
    }

    .intro {
      margin: 11px 0 29px;
      text-align: center;
      color: #737b86;
      font-size: 13px;
      line-height: 1.65;
    }

    .field {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin: 0 0 7px 2px;
      font-size: 12px;
      font-weight: 650;
      color: #333c48;
    }

    .input-wrap {
      position: relative;
    }

    input[type="text"],
    input[type="password"] {
      display: block;
      width: 100%;
      height: 47px;
      border: 1px solid transparent;
      outline: none;
      border-radius: 11px;
      padding: 0 14px;
      background: #f2f4f7;
      color: #171b22;
      font: inherit;
      font-size: 13px;
      transition: border-color .18s, background .18s;
    }

    input:focus {
      border-color: #8abde4;
      background: #fff;
    }

    input::placeholder {
      color: #9aa1ab;
    }

    .password-input {
      padding-right: 47px !important;
    }

    .toggle-password {
      position: absolute;
      top: 50%;
      right: 12px;
      transform: translateY(-50%);
      border: 0;
      background: transparent;
      color: #7b8490;
      cursor: pointer;
      font-size: 11px;
      font-weight: 650;
    }

    .captcha-row {
      display: grid;
      grid-template-columns: 1fr 112px 36px;
      gap: 8px;
      align-items: end;
    }

    .captcha-display {
      height: 47px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px dashed #cbd4df;
      border-radius: 11px;
      background: #f7f9fb;
      color: #18355e;
      font: italic 700 19px Georgia, serif;
      letter-spacing: 4px;
      user-select: none;
      text-decoration: line-through;
      text-decoration-color: #a6b8c9;
      background-image: repeating-linear-gradient(165deg, transparent 0 12px, rgba(38, 120, 189, .05) 13px 14px);
    }

    .refresh-captcha {
      height: 47px;
      width: 36px;
      border: 1px solid #e7eaf0;
      border-radius: 10px;
      background: #fff;
      color: #18355e;
      font-size: 19px;
      cursor: pointer;
    }

    .form-options {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 1px 0 20px;
      font-size: 11px;
    }

    .remember {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #69727e;
    }

    .remember input {
      accent-color: #18355e;
    }

    a {
      color: #155b98;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    .login-button {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      height: 48px;
      border: 0;
      border-radius: 11px;
      background: linear-gradient(45deg, #18355e, #5c78ff);
      color: #fff;
      font: inherit;
      font-size: 13px;
      font-weight: 650;
      cursor: pointer;
      transition: transform .18s, background .18s;
    }

    .login-button:hover {
      background: #18355e;
      transform: translateY(-1px);
    }

    .login-button span {
      font-size: 17px;
    }

    .form-message {
      min-height: 18px;
      margin: 10px 0 0;
      text-align: center;
      font-size: 11px;
      color: #b42318;
    }

    .terms {
      margin: 20px 0 0;
      text-align: center;
      color: #858b94;
      font-size: 10px;
      line-height: 1.7;
    }

    .terms a {
      color: #424b56;
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    .visual-side {
      position: relative;
      min-height: 676px;
      overflow: hidden;
      border-radius: 22px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      isolation: isolate;
      background:
        radial-gradient(ellipse at 76% 7%, rgba(255, 221, 151, .8), transparent 24%),
        radial-gradient(ellipse at 91% 34%, rgba(255, 126, 173, .74), transparent 28%),
        radial-gradient(ellipse at 17% 53%, rgba(255, 151, 205, .68), transparent 31%),
        radial-gradient(ellipse at 45% 72%, rgba(135, 185, 241, .72), transparent 34%),
        linear-gradient(145deg, #f8f9fa, #eef1f5 78%);
    }

    .visual-side::before,
    .visual-side::after {
      content: "";
      position: absolute;
      z-index: -1;
      border-radius: 50%;
      filter: blur(24px);
      opacity: .7;
    }

    .visual-side::before {
      width: 270px;
      height: 190px;
      background: #ffc5d8;
      left: -95px;
      top: 28%;
    }

    .visual-side::after {
      width: 250px;
      height: 210px;
      background: #a6d7f2;
      right: -95px;
      bottom: 8%;
    }

    .trust-label {
      text-align: center;
      z-index: 1;
    }

    .trust-label .laurel {
      color: #18355e;
      font-size: 22px;
      letter-spacing: 3px;
    }

    .trust-label strong {
      display: block;
      margin-top: 2px;
      font-size: 23px;
      letter-spacing: -.7px;
    }

    .trust-label p {
      margin: 7px 0 0;
      font-size: 11px;
      color: #4e5966;
      line-height: 1.45;
    }

    .showcase {
      position: relative;
      width: min(510px, 100%);
      height: 420px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 28px;
    }

    .phone {
      position: relative;
      width: 194px;
      height: 355px;
      padding: 9px;
      border: 4px solid #272b30;
      border-radius: 34px;
      background: #fff;
      box-shadow: 0 22px 35px rgba(28, 42, 59, .18), inset 0 0 0 1px #aeb3b8;
    }

    .phone.phone-two {
      width: 184px;
      height: 326px;
      margin-top: 85px;
      transform: rotate(1deg);
    }

    .phone:first-child {
      transform: rotate(-2deg);
    }

    .notch {
      position: absolute;
      z-index: 2;
      top: 7px;
      left: 50%;
      transform: translateX(-50%);
      width: 66px;
      height: 17px;
      border-radius: 12px;
      background: #101215;
    }

    .screen {
      height: 100%;
      border-radius: 23px;
      overflow: hidden;
      padding: 28px 11px 10px;
      background: linear-gradient(#fff, #f8fafc);
    }

    .screen-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #596372;
      font-size: 8px;
      padding-bottom: 14px;
    }

    .mini-brand {
      font-weight: 800;
      color: #18355e;
      font-size: 10px;
    }

    .screen h3 {
      font-size: 17px;
      line-height: 1.18;
      text-align: center;
      letter-spacing: -.5px;
      margin: 18px 0 9px;
    }

    .screen p {
      font-size: 8px;
      line-height: 1.55;
      text-align: center;
      color: #737d89;
      margin: 0 0 13px;
    }

    .coverage-card {
      padding: 12px 10px;
      border-radius: 12px;
      background: #f0f4f8;
      border: 1px solid #e4eaf0;
    }

    .coverage-icon {
      width: 26px;
      height: 26px;
      display: grid;
      place-items: center;
      background: #dcecf9;
      color: #18355e;
      border-radius: 8px;
      font-size: 15px;
      margin-bottom: 9px;
    }

    .coverage-card b {
      display: block;
      font-size: 9px;
      margin-bottom: 4px;
    }

    .coverage-card small {
      display: block;
      color: #75808c;
      font-size: 7px;
      line-height: 1.45;
    }

    .screen-button {
      margin-top: 12px;
      padding: 10px 6px;
      background: #111;
      color: #fff;
      border-radius: 7px;
      text-align: center;
      font-size: 8px;
    }

    .benefits {
      display: flex;
      gap: 6px;
      margin-top: 11px;
    }

    .benefits span {
      flex: 1;
      padding: 8px 2px;
      border-radius: 7px;
      background: #f0f3f6;
      text-align: center;
      font-size: 7px;
      color: #596372;
    }

    .mini-list {
      margin-top: 15px;
      display: grid;
      gap: 9px;
    }

    .mini-list div {
      display: flex;
      gap: 7px;
      align-items: center;
      font-size: 8px;
      color: #505b68;
    }

    .check {
      width: 15px;
      height: 15px;
      border-radius: 5px;
      background: #e1f2e9;
      color: #27734b;
      display: grid;
      place-items: center;
      font-size: 9px;
    }

    .stats {
      display: flex;
      width: 100%;
      max-width: 490px;
      justify-content: space-between;
      gap: 15px;
      z-index: 1;
    }

    .stat {
      text-align: center;
      color: #343c46;
      font-size: 12px;
      white-space: nowrap;
    }

    .stat strong {
      font-size: 20px;
      font-weight: 550;
      letter-spacing: -.8px;
    }

    .stat span {
      display: block;
      margin-top: 4px;
      color: #69737f;
      font-size: 10px;
    }

    .decorative-plus {
      position: absolute;
      right: 35px;
      top: 23%;
      color: rgba(255, 255, 255, .8);
      font-size: 90px;
      font-weight: 200;
      transform: rotate(14deg);
    }

    @media (max-width: 850px) {
      body {
        padding: 14px;
      }

      .login-shell {
        grid-template-columns: 1fr;
        max-width: 560px;
        padding: 8px;
        gap: 8px;
      }

      .login-side {
        padding: 45px 28px;
      }

      .visual-side {
        min-height: 600px;
        padding: 30px 20px 25px;
      }

      .showcase {
        transform: scale(.9);
        margin: -10px 0;
      }
    }

    @media (max-width: 470px) {
      body {
        padding: 0;
        background: #fff;
      }

      .login-shell {
        border-radius: 0;
        padding: 0;
        box-shadow: none;
      }

      .login-side {
        padding: 38px 23px;
      }

      .visual-side {
        min-height: 520px;
        border-radius: 18px;
        padding: 28px 12px 23px;
        width: 90%;
        margin: auto;
      }

      .showcase {
        transform: scale(.75);
        width: 130%;
        margin: -42px 0;
      }

      .phone {
        flex-shrink: 0;
      }

      .stats {
        gap: 8px;
      }

      .stat strong {
        font-size: 16px;
      }

      .stat {
        font-size: 10px;
      }

      .stat span {
        font-size: 9px;
      }

      .captcha-row {
        grid-template-columns: 1fr 94px 34px;
        gap: 6px;
      }
    }

    .login-logo {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 70px;
    }

    .login-logo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .login-title span {
      color: #000000;
    }
    
    .visual-right {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .visual-right img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .visual-side-overlay {
      position: absolute;
      inset: 0;
      z-index: 1;
      background: linear-gradient(
        180deg,
        rgba(10, 24, 48, 0.3) 0%,
        rgba(10, 24, 48, 0.58) 50%,
        rgba(10, 24, 48, 0.82) 100%
      );
    }

    .visual-caption {
      position: absolute;
      inset: 0;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 44px 36px;
      color: #ffffff;
      pointer-events: none;
    }

    .visual-eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 6px 15px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.16);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.28);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: #ffffff;
      margin-bottom: 16px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.15);
    }

    .visual-eyebrow svg {
      color: #72b7ff;
    }

    .visual-title {
      font-size: 32px;
      font-weight: 700;
      line-height: 1.25;
      color: #ffffff;
      margin: 0 0 14px;
      max-width: 440px;
      letter-spacing: -0.5px;
      text-shadow: 0 2px 14px rgba(0, 0, 0, 0.4);
    }

    .visual-subtitle {
      font-size: 14.5px;
      font-weight: 400;
      line-height: 1.65;
      color: rgba(255, 255, 255, 0.92);
      max-width: 430px;
      margin: 0;
      text-shadow: 0 1px 8px rgba(0, 0, 0, 0.4);
    }

    @media (max-width: 900px) {
      .visual-title {
        font-size: 26px;
      }

      .visual-subtitle {
        font-size: 13.5px;
      }

      .visual-caption {
        padding: 28px 20px;
      }
    }
  </style>
</head>

<body>
  <main class="login-shell">
    <section class="login-side" aria-labelledby="login-title">
      <div class="login-content">
        <div class="login-logo">
          <img src="https://res.cloudinary.com/ddvts796m/image/upload/v1792471750/adnic-logo_hj4bpx.png" alt="ADNIC">
        </div>
        <br>
        <h1 class="login-title" id="login-title">Your <span>health</span><br />Our <span>commitment</span></h1>
        <br>
        <form id="loginForm" action="./memberDetails.html" method="GET" novalidate>
          <div class="field">
            <input id="username" name="username" type="text" placeholder="Enter your username" autocomplete="username"
              required />
          </div>
          <div class="field">
            <div class="input-wrap">
              <input class="password-input" id="password" name="password" type="password"
                placeholder="Enter your password" autocomplete="current-password" required />
            </div>
          </div>
          <div class="field">
            <div class="captcha-row">
              <input id="captchaInput" name="captcha" type="text" placeholder="Type the code" autocomplete="off"
                required />
              <div class="captcha-display" id="captchaDisplay" aria-label="Captcha code">A7K4P</div>
              <button class="refresh-captcha" type="button" id="refreshCaptcha" aria-label="Generate a new captcha"
                title="Generate a new captcha">↻</button>
            </div>
          </div>
          <div class="form-options">
            <label class="remember"><input type="checkbox" name="remember" /> Remember me</label>
            <a href="#forgot-password" id="forgotLink">Forgot password?</a>
          </div>
          <a href="./memberDetails.html">
            <button class="login-button" type="submit">Login <span aria-hidden="true">→</span></button>
          </a>
          <p class="form-message" id="formMessage" role="status" aria-live="polite"></p>
        </form>
      </div>
    </section>

    <aside class="visual-side" aria-label="Insurance Overview">
      <div class="visual-side-overlay"></div>
      <div class="visual-right">
        <img src="https://res.cloudinary.com/ddvts796m/image/upload/v1792471805/adnic-login_cu4xkn.jpg" alt="ADNIC Insurance">
      </div>
      <div class="visual-caption">
        <span class="visual-eyebrow">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          </svg>
          Reliable Protection
        </span>
        <h2 class="visual-title">Securing What Matters Most</h2>
        <p class="visual-subtitle">
          Comprehensive coverage and dedicated care designed to protect your family, health, and future with complete peace of mind.
        </p>
      </div>
    </aside>
  </main>

  <script>
    const captchaDisplay = document.getElementById('captchaDisplay');
    const captchaInput = document.getElementById('captchaInput');
    const formMessage = document.getElementById('formMessage');
    const captchaCharacters = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';

    function generateCaptcha() {
      let code = '';
      for (let i = 0; i < 5; i++) {
        code += captchaCharacters[Math.floor(Math.random() * captchaCharacters.length)];
      }
      captchaDisplay.textContent = code;
      captchaInput.value = '';
    }

    document.getElementById('refreshCaptcha').addEventListener('click', () => {
      generateCaptcha();
      formMessage.textContent = '';
    });
  </script>
</body>

</html>
